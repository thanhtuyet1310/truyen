<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Link Truyện</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #fdeef1; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; transition: background 0.3s; }
        .card { background: #ffffff; border-radius: 20px; padding: 35px 30px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }
        .title { text-align: center; font-size: 24px; font-weight: 700; color: #bd2868; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: color 0.3s; }
        .form-group { margin-bottom: 20px; }
        label.form-label { display: block; font-weight: 600; font-size: 14px; color: #333; margin-bottom: 8px; }
        input[type="text"], select { width: 100%; padding: 12px 15px; border: 1.5px solid #f2cfd9; border-radius: 10px; font-size: 14px; outline: none; background-color: #fff; transition: border-color 0.3s; }
        input[type="text"]:focus, select:focus { border-color: #bd2868; }
        .sub-text { font-size: 12px; color: #888; margin-top: 5px; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 18px; }
        .checkbox-group input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: #bd2868; cursor: pointer; }
        .checkbox-label { font-size: 14px; font-weight: 600; color: #333; }
        .btn-submit { width: 100%; background-color: #bd2868; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .result-box { background-color: #fff0f5; border: 1px dashed #bd2868; border-radius: 10px; padding: 12px; margin-top: 15px; word-break: break-all; display: none; }
        .result-title { font-size: 12px; font-weight: bold; color: #bd2868; margin-bottom: 5px; }
        .result-url { font-size: 13px; color: #333; font-weight: 500; margin-bottom: 8px; }
        .btn-copy { width: 100%; background-color: #4caf50; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-copy:hover { background-color: #45a049; }

        .footer-link { text-align: center; margin-top: 15px; }
        .footer-link a { color: #aaa; font-size: 13px; text-decoration: none; cursor: pointer; }
        .footer-link a:hover { color: #bd2868; }

        /* Giao diện Xanh Lam cho Nhật Vy */
        body.theme-blue { background-color: #eef7ff; }
        body.theme-blue .title { color: #1e88e5; }
        body.theme-blue input[type="text"], body.theme-blue select { border-color: #bbdefb; }
        body.theme-blue input[type="text"]:focus, body.theme-blue select:focus { border-color: #1e88e5; }
        body.theme-blue .checkbox-group input[type="checkbox"] { accent-color: #1e88e5; }
        body.theme-blue .btn-submit { background-color: #1e88e5; }
        body.theme-blue .result-box { background-color: #f0f8ff; border-color: #1e88e5; }
        body.theme-blue .result-title { color: #1e88e5; }
    </style>
</head>
<body>

    <div class="card">
        <h2 class="title">🔗 Tạo Link Truyện</h2>

        <div class="form-group">
            <label class="form-label">Thuộc page nào?</label>
            <select id="pageSelect" onchange="changeTheme()">
                <option value="thanh-tuyet">❄️ Thanh Tuyết</option>
                <option value="thanh-tuyet-2">❄️ Thanh Tuyết 2.0</option>
                <option value="nhat-vy">💙 Nhật Vy</option>
                <option value="nhat-vy-2">💙 Nhật Vy 2.0</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Link truyện gốc</label>
            <input type="text" id="originUrl" placeholder="https://cunconthichanrau.com/novel/chim-tuoc-trong-tay-ao" oninput="autoFillName()" onpaste="setTimeout(autoFillName, 50)" onchange="autoFillName()">
            <div class="sub-text">Dán link vào — tên truyện sẽ tự điền 🪄</div>
        </div>

        <div class="form-group">
            <label class="form-label">Tên bộ truyện</label>
            <input type="text" id="storyName" placeholder="Tự động điền khi dán link...">
            <div class="sub-text">Chỉnh tay nếu tên chưa đúng</div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="vpnRequired">
            <div>
                <label for="vpnRequired" class="checkbox-label">Cần bật 1.1.1.1 để đọc 🌐</label>
                <div class="sub-text">Tick vào nếu web này bị chặn ở Việt Nam (Wattpad...)</div>
            </div>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="createLinkDirectly()">✨ Tạo link ngay</button>

        <div class="result-box" id="resultBox">
            <div class="result-title">LINK DẪN MỚI CỦA BẠN:</div>
            <div class="result-url" id="newUrlText"></div>
            <button class="btn-copy" onclick="copyResultLink()">📋 Sao chép link mới</button>
        </div>

        <div class="footer-link">
            <a onclick="setupToken()">Đổi token</a>
        </div>
    </div>

    <script>
        var REPO_OWNER = "thanhtuyet1310";
        var REPO_NAME = "truyen";

        function changeTheme() {
            var page = document.getElementById('pageSelect').value;
            if (page === 'nhat-vy' || page === 'nhat-vy-2') {
                document.body.classList.add('theme-blue');
            } else {
                document.body.classList.remove('theme-blue');
            }
        }

        function toSlug(str) {
            if (!str) return "";
            str = str.toLowerCase();
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            str = str.replace(/[^a-z0-9\s-]/g, '');
            return str.trim().replace(/\s+/g, '-');
        }

        function autoFillName() {
            var urlInput = document.getElementById('originUrl').value.trim();
            if (!urlInput) return;
            try {
                var urlObj = new URL(urlInput);
                var parts = urlObj.pathname.split('/').filter(function(p) { return p.length > 0; });
                if (parts.length > 0) {
                    var rawSlug = parts[parts.length - 1].replace(/\.html?$/i, '');
                    document.getElementById('storyName').value = decodeURIComponent(rawSlug).replace(/-/g, ' ');
                }
            } catch (e) {
                // Nếu dán chuỗi không có https://
                var partsAlt = urlInput.split('/').filter(function(p) { return p.length > 0; });
                if (partsAlt.length > 0) {
                    var rawSlugAlt = partsAlt[partsAlt.length - 1].replace(/\.html?$/i, '');
                    document.getElementById('storyName').value = decodeURIComponent(rawSlugAlt).replace(/-/g, ' ');
                }
            }
        }

        function setupToken() {
            var token = prompt("Nhập GitHub Personal Access Token của bạn:");
            if (token) {
                localStorage.setItem("gh_token", token.trim());
                alert("Đã lưu token thành công!");
            }
        }

        function copyResultLink() {
            var linkText = document.getElementById('newUrlText').innerText;
            if (linkText) {
                navigator.clipboard.writeText(linkText);
                alert("Đã sao chép link: " + linkText);
            }
        }

        function utf8_to_b64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        async function createLinkDirectly() {
            var token = localStorage.getItem("gh_token");
            if (!token) {
                token = prompt("Vui lòng nhập GitHub Personal Access Token của bạn:");
                if (!token) return;
                token = token.trim();
                localStorage.setItem("gh_token", token);
            }

            var targetUrl = document.getElementById('originUrl').value.trim();
            var rawName = document.getElementById('storyName').value.trim();
            var isVpn = document.getElementById('vpnRequired').checked;
            var selectedPage = document.getElementById('pageSelect').value;

            if (!targetUrl) {
                alert("Vui lòng điền Link truyện gốc!");
                return;
            }

            if (!rawName) {
                autoFillName();
                rawName = document.getElementById('storyName').value.trim();
            }

            var slug = toSlug(rawName);
            if (!slug) {
                alert("Vui lòng nhập Tên bộ truyện!");
                return;
            }

            var filePath = slug + "/index.html";

            var extraNotice = '';
            if (isVpn) {
                extraNotice = '<p style="color: #d32f2f; margin-top: 15px; font-weight: bold; font-size: 14px; padding: 12px; background: rgba(211, 47, 47, 0.1); border-radius: 8px;">Nếu bạn không vào được trang web, hãy bật app 1.1.1.1 hoặc VPN, sau đó load lại là sẽ vào được nè</p>';
            }

            var fallingEffectCode = '';
            if (selectedPage === 'thanh-tuyet' || selectedPage === 'thanh-tuyet-2') {
                fallingEffectCode = '<style>.snowflake{color:#fff;font-size:1em;font-family:Arial,sans-serif;text-shadow:0 0 5px #000;position:fixed;top:-10%;z-index:9999;user-select:none;cursor:default;animation-name:snowflakes-fall,snowflakes-shake;animation-duration:10s,3s;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite}@keyframes snowflakes-fall{0%{top:-10%}100%{top:100%}}@keyframes snowflakes-shake{0%,100%{transform:translateX(0)}50%{transform:translateX(80px)}}.snowflake:nth-of-type(0){left:1%;animation-delay:0s,0s}.snowflake:nth-of-type(1){left:10%;animation-delay:1s,1s}.snowflake:nth-of-type(2){left:20%;animation-delay:6s,.5s}.snowflake:nth-of-type(3){left:30%;animation-delay:4s,2s}.snowflake:nth-of-type(4){left:40%;animation-delay:2s,2s}.snowflake:nth-of-type(5){left:50%;animation-delay:8s,3s}.snowflake:nth-of-type(6){left:60%;animation-delay:6s,2s}.snowflake:nth-of-type(7){left:70%;animation-delay:2.5s,1s}.snowflake:nth-of-type(8){left:80%;animation-delay:1s,0s}.snowflake:nth-of-type(9){left:90%;animation-delay:3s,1.5s}</style><div class="snowflakes" aria-hidden="true"><div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❅</div></div>';
            } else if (selectedPage === 'nhat-vy' || selectedPage === 'nhat-vy-2') {
                fallingEffectCode = '<style>.heartflake{color:#1e88e5;font-size:1.2em;position:fixed;top:-10%;z-index:9999;user-select:none;cursor:default;animation-name:hearts-fall,hearts-shake;animation-duration:9s,3s;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite}@keyframes hearts-fall{0%{top:-10%}100%{top:100%}}@keyframes hearts-shake{0%,100%{transform:translateX(0)}50%{transform:translateX(60px)}}.heartflake:nth-of-type(0){left:3%;animation-delay:0s,0s}.heartflake:nth-of-type(1){left:12%;animation-delay:1.5s,1s}.heartflake:nth-of-type(2){left:25%;animation-delay:5s,.5s}.heartflake:nth-of-type(3){left:35%;animation-delay:3s,2s}.heartflake:nth-of-type(4){left:45%;animation-delay:1s,2s}.heartflake:nth-of-type(5){left:55%;animation-delay:7s,3s}.heartflake:nth-of-type(6){left:68%;animation-delay:4s,2s}.heartflake:nth-of-type(7){left:78%;animation-delay:2s,1s}.heartflake:nth-of-type(8){left:88%;animation-delay:0.5s,0s}</style><div class="heartflakes" aria-hidden="true"><div class="heartflake">💙</div><div class="heartflake">💙</div><div class="heartflake">💙</div><div class="heartflake">💙</div><div class="heartflake">💙</div><div class="heartflake">💙</div><div class="heartflake">💙</div><div class="heartflake">💙</div><div class="heartflake">💙</div></div>';
            }

            var mainThemeColor = (selectedPage === 'nhat-vy' || selectedPage === 'nhat-vy-2') ? '#1e88e5' : '#bd2868';
            var bgThemeColor = (selectedPage === 'nhat-vy' || selectedPage === 'nhat-vy-2') ? '#eef7ff' : '#fff0f5';

            var htmlContent = '<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đang chuyển hướng...</title><meta http-equiv="refresh" content="1; url=' + targetUrl + '">' + fallingEffectCode + '<script>setTimeout(function(){ window.location.href = "' + targetUrl + '"; }, 1000);<\/script></head><body style="font-family: sans-serif; text-align: center; padding: 50px 20px; background-color: ' + bgThemeColor + ';"><h2 style="color: ' + mainThemeColor + ';">Đang chuyển hướng đến trang đọc truyện...</h2>' + extraNotice + '<p style="margin-top: 20px; color: #666;">Nếu trình duyệt không tự chuyển, <a href="' + targetUrl + '" style="color: ' + mainThemeColor + ';">bấm vào đây</a>.</p></body></html>';

            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "⏳ Đang tạo link...";

            try {
                var sha = "";
                var checkRes = await fetch("https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + filePath, {
                    headers: { "Authorization": "token " + token }
                });
                
                if (checkRes.ok) {
                    var checkData = await checkRes.json();
                    sha = checkData.sha;
                }

                var bodyData = {
                    message: "Auto create link for " + slug,
                    content: utf8_to_b64(htmlContent)
                };
                if (sha) bodyData.sha = sha;

                var uploadRes = await fetch("https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + filePath, {
                    method: "PUT",
                    headers: {
                        "Authorization": "token " + token,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(bodyData)
                });

                if (uploadRes.ok) {
                    var finalUrl = "https://" + REPO_OWNER + ".github.io/" + REPO_NAME + "/" + slug + "/";
                    
                    try {
                        navigator.clipboard.writeText(finalUrl);
                    } catch (e) {}

                    document.getElementById('newUrlText').innerText = finalUrl;
                    document.getElementById('resultBox').style.display = 'block';

                    alert("✨ ĐÃ TẠO LINK THÀNH CÔNG!\n\nLink mới của bạn là:\n" + finalUrl + "\n\n(Đã tự động sao chép link. Sau 1-2 phút GitHub cập nhật xong là bấm vào được ngay!)");
                } else {
                    var errData = await uploadRes.json();
                    alert("⚠️ Lỗi từ GitHub: " + (errData.message || "Token không hợp lệ"));
                }
            } catch (err) {
                alert("⚠️ Có lỗi xảy ra: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "✨ Tạo link ngay";
            }
        }
    </script>
</body>
</html>
