<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Link Truyện</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #fdeef1; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #ffffff; border-radius: 20px; padding: 35px 30px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }
        .title { text-align: center; font-size: 24px; font-weight: 700; color: #bd2868; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .form-group { margin-bottom: 20px; }
        label.form-label { display: block; font-weight: 600; font-size: 14px; color: #333; margin-bottom: 8px; }
        input[type="text"], select { width: 100%; padding: 12px 15px; border: 1.5px solid #f2cfd9; border-radius: 10px; font-size: 14px; outline: none; background-color: #fff; }
        input[type="text"]:focus, select:focus { border-color: #bd2868; }
        .sub-text { font-size: 12px; color: #888; margin-top: 5px; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 18px; }
        .checkbox-group input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: #bd2868; cursor: pointer; }
        .checkbox-label { font-size: 14px; font-weight: 600; color: #333; }
        .result-box { background-color: #fff0f5; border: 1px dashed #bd2868; border-radius: 10px; padding: 12px; margin-top: 15px; word-break: break-all; display: none; }
        .result-title { font-size: 12px; font-weight: bold; color: #bd2868; margin-bottom: 5px; }
        .result-url { font-size: 13px; color: #333; font-weight: 500; }
        .btn-submit { width: 100%; background-color: #bd2868; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #a02056; }
        .btn-copy { width: 100%; background-color: #4caf50; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 class="title">🔗 Tạo Link Truyện</h2>

        <div class="form-group">
            <label class="form-label">Thuộc page nào?</label>
            <select id="pageSelect">
                <option value="cong-chua">👑 Công Chúa Mê Ngôn Tình</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Link truyện gốc</label>
            <input type="text" id="originUrl" placeholder="https://truyenhd.cc/truyen/chim-tuoc-trong-tay-ao/" oninput="processLink()">
            <div class="sub-text">Dán link vào — tên truyện & link mới sẽ tự điền 🪄</div>
        </div>

        <div class="form-group">
            <label class="form-label">Tên bộ truyện (slug)</label>
            <input type="text" id="slugName" placeholder="chim-tuoc-trong-tay-ao" oninput="updateResultLink()">
            <div class="sub-text">Dùng làm tên thư mục/file trên GitHub</div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="vpnRequired">
            <div>
                <label for="vpnRequired" class="checkbox-label">Cần bật 1.1.1.1 để đọc 🌐</label>
                <div class="sub-text">Tick vào nếu web này bị chặn ở Việt Nam (Wattpad...)</div>
            </div>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-title">LINK DẪN MỚI CỦA BẠN:</div>
            <div class="result-url" id="newUrlText">https://thanhtuyet1310.github.io/truyen/</div>
            <button class="btn-copy" onclick="copyLink()">📋 Sao chép link mới</button>
        </div>

        <button class="btn-submit" onclick="generateAndDownload()">✨ Tải file HTML để up lên GitHub</button>
    </div>

    <script>
        const BASE_DOMAIN = "https://thanhtuyet1310.github.io/truyen/";

        function processLink() {
            const urlInput = document.getElementById('originUrl').value.trim();
            if (!urlInput) return;

            try {
                const urlObj = new URL(urlInput);
                const pathParts = urlObj.pathname.split('/').filter(part => part.length > 0);
                
                if (pathParts.length > 0) {
                    let slug = pathParts[pathParts.length - 1];
                    slug = slug.replace(/\.html?$/i, '');
                    document.getElementById('slugName').value = slug;
                    updateResultLink();
                }
            } catch (e) {}
        }

        function updateResultLink() {
            const slug = document.getElementById('slugName').value.trim();
            const resultBox = document.getElementById('resultBox');
            const newUrlText = document.getElementById('newUrlText');

            if (slug) {
                newUrlText.innerText = BASE_DOMAIN + slug + "/";
                resultBox.style.display = "block";
            } else {
                resultBox.style.display = "none";
            }
        }

        function copyLink() {
            const linkText = document.getElementById('newUrlText').innerText;
            navigator.clipboard.writeText(linkText);
            alert('Đã sao chép link: ' + linkText);
        }

        function generateAndDownload() {
            const targetUrl = document.getElementById('originUrl').value.trim();
            const slug = document.getElementById('slugName').value.trim();
            const isVpn = document.getElementById('vpnRequired').checked;

            if (!targetUrl || !slug) {
                alert('Vui lòng nhập Link truyện gốc!');
                return;
            }

            let extraNotice = '';
            if (isVpn) {
                extraNotice = '<p style="color: #d32f2f; margin-top: 10px; font-weight: bold;">⚠️ Truyện này cần bật ứng dụng 1.1.1.1 (VPN) mới truy cập được!</p>';
            }

            const htmlContent = `<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng...</title>
    <meta http-equiv="refresh" content="1; url=${targetUrl}">
    <script>
        setTimeout(() => { window.location.href = "${targetUrl}"; }, 1000);
    <\/script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #fff0f5;">
    <h2 style="color: #bd2868;">Đang chuyển hướng đến trang đọc truyện...</h2>
    ${extraNotice}
    <p style="margin-top: 20px; color: #666;">Nếu trình duyệt không tự chuyển, <a href="${targetUrl}" style="color: #bd2868;">bấm vào đây</a>.</p>
</body>
</html>`;

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "index.html"; 
            link.click();
        }
    </script>
</body>
</html>
